# The split profile: renderd as its own service, which reportd finds
# through compose's DNS name and spreads renders over (renderer.discover:
# dns). Each renderd requires a token made once in ./secrets.
#
#   docker compose -f docker-compose.yml -f split.yml up -d --scale renderd=3
services:
  secrets:
    image: ${REPORTD_IMAGE:-ghcr.io/frontforge-corporation/report-server:0.10.0}
    user: "0:0"
    command: ["reportd", "compose-secrets", "--dir", "/secrets"]
    volumes:
      - ./secrets:/secrets
    restart: "no"
    healthcheck:
      disable: true
    read_only: true
    # Only what writing, and giving away, files in ./secrets needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]

  renderd:
    image: ${REPORTD_IMAGE:-ghcr.io/frontforge-corporation/report-server:0.10.0}
    restart: unless-stopped
    command: ["renderd", "--token-file", "/run/secrets/renderd-token"]
    environment:
      RENDERD_LISTEN: 0.0.0.0:43124
    volumes:
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "renderd", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      secrets:
        condition: service_completed_successfully

  reportd:
    environment:
      # No renderd inside: the instances behind the name renderd.
      REPORTD_RENDERER_COMMAND: ""
      REPORTD_RENDERER_DISCOVER: dns
      REPORTD_RENDERER_DISCOVERNAME: renderd:43124
      REPORTD_RENDERER_TOKEN: secret:file:renderd-token
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      renderd:
        condition: service_healthy
